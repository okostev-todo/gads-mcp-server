steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/cobalt-aria-495011-u4/google-ads-mcp/server:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/cobalt-aria-495011-u4/google-ads-mcp/server:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/cobalt-aria-495011-u4/google-ads-mcp/server'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'google-ads-mcp'
      - '--image'
      - 'us-central1-docker.pkg.dev/cobalt-aria-495011-u4/google-ads-mcp/server:$COMMIT_SHA'
      - '--platform'
      - 'managed'
      - '--region'
      - 'us-central1'
      - '--project'
      - 'cobalt-aria-495011-u4'

images:
  - 'us-central1-docker.pkg.dev/cobalt-aria-495011-u4/google-ads-mcp/server:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/cobalt-aria-495011-u4/google-ads-mcp/server:latest'

options:
  logging: CLOUD_LOGGING_ONLY
